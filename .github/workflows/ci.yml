name: ShopSphere CI/CD Production Pipeline

on:
  push:
    branches: [main, staging, development]
  pull_request:
    branches: [main, staging]

jobs:
  # ============================================================================
  # STEP 1 & 2: Install Dependencies, Build, and Run Tests
  # ============================================================================
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_jwt_secret_key' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run Backend Test Suite
        working-directory: backend
        run: npm test -- --forceExit

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  # ============================================================================
  # STEP 3: Automated Production Deployment
  # ============================================================================
  deploy-production:
    name: Deploy to Production (CD)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trigger Production Deployment via Vercel Deploy Hook
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "🚀 Triggering automated production deployment..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "✅ Production deployment triggered successfully."

      - name: Verify Production Health Check
        run: |
          echo "🩺 Validating Production Backend Health Endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fullstack-ecommerce-cloud-younes-al.vercel.app/health || echo "000")
          echo "Backend Health Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 308 ]; then
            echo "✅ Production Backend is Healthy."
          else
            echo "⚠️ Health check returned status: $HTTP_STATUS"
          fi