apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-backend
  namespace: gcp-simulation
  labels:
    app: shopsphere-backend
    provider: gcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopsphere-backend
  template:
    metadata:
      labels:
        app: shopsphere-backend
    spec:
      containers:
      - name: backend
        image: node:20-alpine
        command: ["node", "-e", "const http = require('http'); const server = http.createServer((req, res) => { res.writeHead(200, {'Content-Type': 'application/json'}); res.end(JSON.stringify({ status: 'OK', provider: 'gcp-simulation', message: 'ShopSphere Backend API online' })); }); server.listen(5000, () => console.log('GCP Backend running on 5000'));"]
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-backend-service
  namespace: gcp-simulation
spec:
  type: ClusterIP
  selector:
    app: shopsphere-backend
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopsphere-frontend
  namespace: gcp-simulation
  labels:
    app: shopsphere-frontend
    provider: gcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopsphere-frontend
  template:
    metadata:
      labels:
        app: shopsphere-frontend
    spec:
      containers:
      - name: frontend
        image: node:20-alpine
        command: ["node", "-e", "const http = require('http'); const server = http.createServer((req, res) => { res.writeHead(200, {'Content-Type': 'text/html'}); res.end('<h1>ShopSphere Frontend (GCP Simulation)</h1>'); }); server.listen(80, () => console.log('GCP Frontend running on 80'));"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-frontend-service
  namespace: gcp-simulation
spec:
  type: ClusterIP
  selector:
    app: shopsphere-frontend
  ports:
  - port: 80
    targetPort: 80
